# Reads real shelf prices for new products from the supermarkets' online shops (tools/fetch_prices.py) and commits them
# to the branch you choose, to be checked by hand before they reach main. Run it from the Actions tab.
name: Preus de productes nous

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "update: actualitza els preus dels productes de tools/new_products.py · collect: només desa els llistats a tmp-raw/ · probe: comprova les fonts"
        type: choice
        options: ["update", "collect", "pages", "probe"]
        default: "update"
      branch:
        description: "Branca on es desen els preus"
        required: true
        default: main

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts
        if: inputs.mode == 'probe'
        run: python3 tools/fetch_prices.py probe
      - name: Llegeix el que llisten les botigues
        if: inputs.mode == 'update' || inputs.mode == 'collect'
        run: python3 tools/fetch_prices.py collect
      - name: Baixa les pàgines font dels preus antics
        if: inputs.mode == 'pages'
        run: python3 tools/fetch_prices.py pages
      - name: Actualitza els preus
        if: inputs.mode == 'update'
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          day=$(date +%F)
          python3 tools/fetch_prices.py build "$day"
          python3 tools/update_data.py history --date "$day"
          python3 tools/update_data.py check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preuet-data.json data/history.json
          if git diff --cached --quiet; then echo "Cap preu nou"; exit 0; fi
          git commit -m "Preus de Mercadona i Consum del $day (productes nous)"
          git push origin "HEAD:$BRANCH"
      - name: Desa-ho a la branca
        if: inputs.mode == 'collect' || inputs.mode == 'pages'
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp-raw/
          if git diff --cached --quiet; then echo "Res de nou"; exit 0; fi
          git commit -m "Llistats de botigues per revisar (tmp-raw)"
          git push origin "HEAD:$BRANCH"
