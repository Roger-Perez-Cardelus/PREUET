# Reads shelf prices straight from the supermarkets' online shops (tools/fetch_prices.py).
# - Every Monday (and on demand, mode "update"): Mercadona, Consum, Ametller Origen and bonÀrea, read whole, committed to main,
#   then the web is published again.
# - "collect" / "pages": only saves what the shops list, or the source pages of older prices, to tmp-raw/ on a branch,
#   to build and check prices by hand. "probe": which shops answer from GitHub's runners.
name: Preus de productes nous

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "update: actualitza Mercadona i Consum · collect: només desa els llistats a tmp-raw/ · pages: desa les pàgines dels preus antics · probe: comprova les fonts"
        type: choice
        options: ["update", "collect", "pages", "probe"]
        default: "update"
      branch:
        description: "Branca on es desen els preus"
        required: true
        default: main

permissions:
  contents: write
  actions: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'update' }}
      BRANCH: ${{ inputs.branch || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts
        if: env.MODE == 'probe'
        run: python3 tools/fetch_prices.py probe
      - name: Llegeix el que llisten les botigues
        if: env.MODE == 'update' || env.MODE == 'collect'
        run: python3 tools/fetch_prices.py collect
      - name: Baixa les pàgines font dels preus antics
        if: env.MODE == 'pages'
        run: python3 tools/fetch_prices.py pages
      - name: Actualitza els preus
        id: update
        if: env.MODE == 'update'
        run: |
          day=$(date +%F)
          python3 tools/fetch_prices.py build "$day"
          python3 tools/update_data.py history --date "$day"
          python3 tools/update_data.py check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preuet-data.json data/history.json
          if git diff --cached --quiet; then echo "Cap preu nou"; exit 0; fi
          git commit -m "Preus de Mercadona, Consum, Ametller i bonÀrea del $day"
          git push origin "HEAD:$BRANCH"
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      - name: Torna a publicar la web
        if: steps.update.outputs.pushed == '1' && env.BRANCH == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Desa-ho a la branca
        if: env.MODE == 'collect' || env.MODE == 'pages'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp-raw/
          if git diff --cached --quiet; then echo "Res de nou"; exit 0; fi
          git commit -m "Llistats de botigues per revisar (tmp-raw)"
          git push origin "HEAD:$BRANCH"
