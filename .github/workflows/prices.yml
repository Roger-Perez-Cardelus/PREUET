# Reads real shelf prices for new products from the supermarkets' online shops (tools/fetch_prices.py) and commits them
# to the branch you choose, to be checked by hand before they reach main. Run it from the Actions tab.
name: Preus de productes nous

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe: comprova les fonts · collect: desa el que llisten les botigues a tmp-raw/ per revisar-ho"
        type: choice
        options: ["probe", "collect"]
        default: "probe"
      branch:
        description: "Branca on es desen els preus"
        required: true
        default: main

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts
        if: inputs.mode == 'probe'
        run: python3 tools/fetch_prices.py probe
      - name: Llegeix el que llisten les botigues
        if: inputs.mode == 'collect'
        run: python3 tools/fetch_prices.py collect
      - name: Desa-ho a la branca
        if: inputs.mode == 'collect'
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp-raw/
          if git diff --cached --quiet; then echo "Res de nou"; exit 0; fi
          git commit -m "Llistats de botigues per revisar (tmp-raw)"
          git push origin "HEAD:$BRANCH"
