# Tests the app and, on every push to main (and on demand from the Actions tab), builds the web version
# (python3 tools/build.py web) and publishes dist/web to GitHub Pages. Pull requests only run the tests.
name: Publica Preuet a GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Valida les dades
        run: python3 tools/update_data.py check
      - name: Tests (model de costos, traduccions, sintaxi)
        run: node --test tests/*.test.mjs
      - name: Construeix la web
        run: python3 tools/build.py web
      - name: Prova de fum i accessibilitat
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.10.2
          npx playwright install --with-deps chromium
          AXE=1 node tests/smoke.mjs

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construeix la web
        run: python3 tools/build.py web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
